<!-- template 
 <h1>post create component</h1> -->

 <!-- two ways of outputting data -->
 <!-- way 1. property binding -->
<textarea rows="6" [value]="newPost" #postInput></textarea> 
<!-- use post input to read input data -->
<hr>
<!-- event listener is click -->
<button (click)="onAddPost(postInput)">Save Post</button> 

<!-- output the content that user has entered -->
 <!-- way 2. use string interpolation to output content -->
 <p>{{ newPost }}</p> 

<hr>

<!-- ngmodel directive instruction placed on html element -->
<textarea rows="6" [(ngModel)]="enteredValue"></textarea> 
<hr>
<button (click)="onAddPost(postInput)">Save Post</button>
